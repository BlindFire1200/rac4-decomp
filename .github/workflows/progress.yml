# ByteMatch progress report (https://bytematch.dev/OpenRAC/rac-deadlocked-decomp), as rac1-decomp
# and rac3-uya-decomp-pal publish theirs.
#
# ByteMatch reads objdiff's report.json from an artifact named "<VERSION>_report"; the version is
# the PAL disc's, SCES_532.85. This job does NOT build the game: SN's toolchain and the retail
# programs cannot be redistributed. tools/progress.py counts everything from src/, nonmatching/
# and tables made from the binaries and committed (config/inventory.tsv,
# config/frontend_pairs.tsv, config/levels/functions.tsv, config/pal_map.tsv: names, addresses,
# sizes and hashes of masked code, no retail bytes), so this job needs no disc: it checks that
# config/pal_map.tsv covers every function of src/ and nonmatching/ and that the committed
# report and README table are current, validates the report with objdiff and uploads it.
#
# The repository must be registered once by hand on ByteMatch; this workflow alone does not
# add it.
name: Progress report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails if src/ or nonmatching/ changed without regenerating config/pal_map.tsv
      # (tools/pal_map.py --write, from a build) and the report (tools/progress.py --write).
      - name: Check the committed report is current
        run: python tools/progress.py --version pal --check

      - name: Validate the report with objdiff
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
          echo "c8290281e82114bcc1a06ff73061110d3902a177822e750337de2537188e358f  $RUNNER_TEMP/objdiff-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/objdiff-cli"
          "$RUNNER_TEMP/objdiff-cli" report changes progress/pal/report.json progress/pal/report.json \
            -o "$RUNNER_TEMP/validation.json"

      - name: Summarise
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("progress/pal/report.json"))
          m = r["measures"]
          print("| Measure | Value |")
          print("| --- | --- |")
          print("| Code matched | %.2f%% (%s / %s bytes), fuzzy %.2f%% |"
                % (m["matched_code_percent"], m["matched_code"], m["total_code"], m["fuzzy_match_percent"]))
          print("| Functions matched | %s / %s |" % (m["matched_functions"], m["total_functions"]))
          print("| Units complete | %s / %s |" % (m["complete_units"], m["total_units"]))
          for c in r["categories"]:
              cm = c["measures"]
              print("| %s | %.2f%% code, %s functions |"
                    % (c["name"], cm["matched_code_percent"], cm["matched_functions"]))
          PY

      - name: Upload the progress report
        uses: actions/upload-artifact@v4
        with:
          name: SCES_532.85_report
          path: progress/pal/report.json
          if-no-files-found: error
